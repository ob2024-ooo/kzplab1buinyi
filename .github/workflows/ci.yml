name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Build wheel
        run: python -m build
      - name: Verify wheel in clean environment
        run: python scripts/verify_wheel.py
      - name: CLI success and error exit codes
        shell: bash
        run: |
          python -m kzp_lab07.cli data/input.csv reports/ci-summary.txt
          set +e
          python -m kzp_lab07.cli data/broken.csv reports/broken.txt
          code=$?
          echo "exit code: $code"
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
